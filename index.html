<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>멜랑코치 · 주화면 프로토타입</title>
<link rel="stylesheet" href="css/style.css?v=202608312131" />
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>멜랑코치</h1>
    </div>
    <nav id="screen-index"></nav>
    <div class="sidebar-foot">
      <button class="ghost-btn" id="btn-reset">처음부터</button>
      <p class="hint">화면 안의 버튼을 눌러 실제 흐름대로 따라갈 수 있어요.</p>
    </div>
  </aside>

  <main class="stage">
    <div class="phone-wrap">
      <div class="phone">
        <div class="viewport" id="viewport"></div>
      </div>
    </div>
    <div class="stage-caption">
      <button class="ghost-btn small" id="btn-back">← 뒤로</button>
      <span id="screen-label">—</span>
    </div>
  </main>

</div>

<script src="js/data.js?v=202608312131"></script>
<script src="js/screens.js?v=202608312131"></script>
<script src="js/app.js?v=202608312131"></script>
</body>
</html>
